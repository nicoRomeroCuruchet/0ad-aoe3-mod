[project]
name = "zero-ad-aoe3-rl"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "gymnasium>=0.29,<1.3",
    "numpy>=1.26,<3",
    "stable-baselines3>=2.3,<3",
    "torch>=2.3,<3",
    "zero-ad @ git+https://gitea.wildfiregames.com/0ad/0ad.git@a2cae4d69f816e9e9d7eecb6bf88f762afc0c90d#subdirectory=source/tools/rlclient/python",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false
required-version = ">=0.11.21"

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["rl/tests"]
pythonpath = ["."]
addopts = [
    "--disable-plugin-autoload",
    "-p",
    "pytest_cov",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".runtime"]

[tool.coverage.run]
source = ["rl"]
omit = ["rl/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

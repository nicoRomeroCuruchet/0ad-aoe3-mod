[environment]
name = "zero_ad_gather"
scenario = "rl/reset_config.json"
uri = "http://localhost:6000"
map_size_m = 512.0
horizon = 50
reach_threshold = 12.0
sim_steps_per_action = 10

[agent]
name = "sb3_sac"
policy = "MlpPolicy"
verbose = 1
learning_starts = 200
buffer_size = 50000
batch_size = 128
train_freq = 8
gradient_steps = 8

[training]
total_steps = 5000
seed = 0
log_interval = 1

[evaluation]
episodes = 1
deterministic = true
seed = 1000

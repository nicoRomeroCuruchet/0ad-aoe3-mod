[environment]
name = "zero_ad_team_gather"
scenario = "rl/scenarios/team_reset_config.json"
uri = "http://localhost:6000"
villager_count = 4
resource_count = 4
map_size_m = 512.0
horizon = 15
sim_steps_per_action = 80
gather_command_distance = 12.0
click_action_threshold = 0.0
stock_resource = "wood"
stock_player = 1
stock_success_threshold = 80.0
carried_resource_observation_scale = 20.0
stock_observation_scale = 1000.0
resource_amount_scale = 200.0
distance_shaping_scale = 0.02
carried_resource_delta_reward_scale = 0.2
click_gather_cycle_penalty = 1.0
backend_retries = 2
backend_retry_delay = 1.0

[agent]
name = "sb3_ppo"
policy = "SharedVillagerPolicy"
# Warm start: M1 already learned the one-villager gather skill, and slice
# indices 0-9 are M1's observation, so its weights load into the prefix.
m1_checkpoint = "rl/runs/m1_sb3_ppo-20260810T231140947825Z/model"
verbose = 1
n_steps = 512
batch_size = 64
n_epochs = 10
gae_lambda = 0.95
ent_coef = 0.01
gamma = 0.9

[training]
total_steps = 200000
seed = 0
log_interval = 1
solved_window_episodes = 10
solved_success_rate = 0.8
solved_min_steps = 3000
solved_check_interval_steps = 3000

[evaluation]
episodes = 10
deterministic = true
seed = 1000

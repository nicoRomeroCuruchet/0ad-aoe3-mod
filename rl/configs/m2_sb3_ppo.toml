[environment]
name = "zero_ad_team_gather"
scenario = "rl/scenarios/team_reset_config.json"
uri = "http://localhost:6000"
villager_count = 4
resource_count = 6
action_mode = "joint_assignment_click"
randomize_layout = true
map_size_m = 512.0
# Oracle finishes in two coordinated waves; this admits recovery but rejects
# a lucky one-shot matching that only clears the first four trees.
horizon = 20
sim_steps_per_action = 80
gather_command_distance = 12.0
click_action_threshold = 0.0
stock_resource = "wood"
stock_player = 1
stock_success_threshold = 600.0
carried_resource_observation_scale = 20.0
stock_observation_scale = 1200.0
resource_amount_scale = 100.0
distance_shaping_scale = 0.02
# Paying per unit chopped is collectable without ever delivering: four loads of
# 20 at 0.2/4 is exactly the 4.0 plateau every run converged to while depositing
# nothing. Wood now only pays when it lands in the stock.
carried_resource_delta_reward_scale = 0.0
click_gather_cycle_penalty = 1.0
# Silence while holding a load is what lets UnitAI finish the haul, so it is
# worth a little. Small on purpose: 20 wood in the stock is worth 20.
carrying_no_click_reward = 0.05
backend_retries = 2
backend_retry_delay = 1.0

[agent]
name = "sb3_ppo"
policy = "JointAssignmentPolicy"
# The categorical begins neutral over feasible bundles. The table/mask encodes
# only physical execution constraints; PPO must discover that a full matching
# and a second wave are what reach the collective 600-wood criterion.
policy_kwargs = { initial_no_click_logit = 0.0 }
verbose = 1
n_steps = 512
batch_size = 64
n_epochs = 10
gae_lambda = 0.95
# M1 solved with no entropy bonus. At 0.01 the spread never fell below 0.86 in
# 14k steps, which is the aiming noise above.
ent_coef = 0.0
gamma = 0.97

[training]
total_steps = 200000
seed = 0
log_interval = 1
# The joint categorical reaches the useful assignment policy in its first PPO
# rollout.  Validate that candidate before later updates can drift toward a
# single all-NO_CLICK label; 20 randomized layouts at 95% keep this a real
# generalization gate rather than a lucky one-episode stop.
solved_window_episodes = 20
solved_success_rate = 0.95
solved_min_steps = 512
solved_check_interval_steps = 512

[evaluation]
episodes = 20
deterministic = true
seed = 1000
